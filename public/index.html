<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ModdyBot — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#020408;--blue:#1a6fff;--blue2:#4d9fff;--cyan:#00d4ff;
      --glow:rgba(26,111,255,0.5);--text:#e8f4ff;--muted:#4a6a8a;
      --border:rgba(26,111,255,0.25);--font:'Rajdhani',sans-serif;--mono:'Share Tech Mono',monospace;
    }
    html,body{width:100%;height:100%;overflow:hidden}
    body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;position:relative}
    body::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(26,111,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(26,111,255,0.04) 1px,transparent 1px);background-size:40px 40px;animation:gp 8s ease-in-out infinite}
    @keyframes gp{0%,100%{opacity:.6}50%{opacity:1}}
    body::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);pointer-events:none}
    .orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;animation:orb 12s ease-in-out infinite}
    .orb1{width:600px;height:600px;background:rgba(26,111,255,0.08);top:-200px;left:-200px}
    .orb2{width:400px;height:400px;background:rgba(0,212,255,0.06);bottom:-150px;right:-100px;animation-delay:-6s}
    @keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}
    .card{
      position:relative;z-index:10;width:420px;
      background:linear-gradient(135deg,rgba(6,12,20,0.95),rgba(2,4,8,0.98));
      border:1px solid var(--border);border-radius:16px;padding:50px 40px;text-align:center;
      box-shadow:0 0 60px rgba(26,111,255,0.1),0 0 120px rgba(26,111,255,0.05),inset 0 1px 0 rgba(26,111,255,0.15);
      animation:fi .6s ease-out;
    }
    @keyframes fi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .card::before,.card::after{content:'';position:absolute;width:20px;height:20px;border-color:var(--blue);border-style:solid}
    .card::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:16px 0 0 0}
    .card::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 16px 0}
    .logo-wrap{width:90px;height:90px;margin:0 auto 24px;border-radius:50%;background:radial-gradient(circle,rgba(26,111,255,0.2),rgba(26,111,255,0.05));border:2px solid rgba(26,111,255,0.4);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px var(--glow),0 0 60px rgba(26,111,255,0.1);animation:lp 3s ease-in-out infinite;overflow:hidden}
    .logo-wrap img{width:80px;height:80px;object-fit:cover;border-radius:50%}
    .logo-fallback{width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 20px var(--blue);display:none}
    @keyframes lp{0%,100%{box-shadow:0 0 30px var(--glow),0 0 60px rgba(26,111,255,0.1)}50%{box-shadow:0 0 50px var(--glow),0 0 100px rgba(26,111,255,0.2)}}
    .title{font-size:32px;font-weight:700;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(135deg,#fff 30%,var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
    .subtitle{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:32px}
    .divider{height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent);margin:0 -10px 32px;opacity:.5}
    .desc{font-size:14px;color:#6a8aaa;line-height:1.6;margin-bottom:36px}
    .desc span{color:var(--cyan);font-weight:600}
    .btn-discord{display:inline-flex;align-items:center;gap:12px;width:100%;padding:14px 24px;background:linear-gradient(135deg,#1a6fff,#0050cc);border:1px solid rgba(26,111,255,0.5);border-radius:10px;color:#fff;font-family:var(--font);font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-decoration:none;cursor:pointer;justify-content:center;transition:all .25s;box-shadow:0 0 20px rgba(26,111,255,0.3),0 4px 15px rgba(0,0,0,0.3);position:relative;overflow:hidden}
    .btn-discord::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);transition:left .5s}
    .btn-discord:hover::before{left:100%}
    .btn-discord:hover{background:linear-gradient(135deg,#2a7fff,#0060dd);box-shadow:0 0 40px rgba(26,111,255,0.5),0 4px 20px rgba(0,0,0,0.4);transform:translateY(-2px)}
    .btn-discord svg{width:24px;height:24px;flex-shrink:0}
    .info{margin-top:24px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7}
    .info span{color:var(--blue2)}
    .status{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;font-family:var(--mono);font-size:11px;color:var(--muted)}
    .status-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:blink 2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .particles{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
    .particle{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--blue);animation:float linear infinite;opacity:0}
    @keyframes float{0%{transform:translateY(100vh);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-100px) translateX(50px);opacity:0}}
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="particles" id="particles"></div>
  <div class="card">
    <div class="logo-wrap">
      <img src="/img/logo.png" alt="MD" onerror="this.style.display='none';document.getElementById('lf').style.display='flex'"/>
      <div class="logo-fallback" id="lf">MD</div>
    </div>
    <div class="title">ModdyBot</div>
    <div class="subtitle">// dashboard v2.0</div>
    <div class="divider"></div>
    <p class="desc">Panel de control para gestionar <span>ModdyBot</span> en tus servidores de Discord.</p>
    <a href="/auth/discord" class="btn-discord">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      Iniciar sesión con Discord
    </a>
    <div class="info">
      Solo puedes acceder si eres <span>Administrador</span> en algún servidor donde esté ModdyBot.
    </div>
    <div class="status"><div class="status-dot"></div><span>SISTEMA OPERATIVO</span></div>
  </div>
  <script>
    const c = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `left:${Math.random()*100}%;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*10}s;width:${Math.random()*3+1}px;height:${Math.random()*3+1}px`;
      c.appendChild(p);
    }
  </script>
</body>
</html>
